openapi: 3.0.3
info:
  title: Dynamic Multi-Phase Scheduling & Optimization API
  version: 1.0.0
  description: >-
    Міжсервісний контракт взаємодії клієнтського застосунку (Vue.js 3 SPA) та
    ядра оптимізації розкладів (FastAPI + OR-Tools CP-SAT + PostgreSQL GiST).
  contact:
    name: Architecture & Backend Engineering Team

servers:
  - url: https://api.scheduling-core.internal/api/v1
    description: Production API Gateway (TLS 1.3)

security:
  - BearerAuth: []

paths:
  /schedules/optimize:
    post:
      tags:
        - Scheduling Engine
      summary: Розрахунок оптимального багатофазного таймлайну (CP-SAT / Fallback)
      description: >-
        Ініціює декомпозицію композитної послуги у DAG та запуск лексикографічної
        оптимізації RCPSP з жорстким time-budgeting 800 мс (SRS-FUN-SOLV-01..03).
      operationId: optimizeSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleOptimizationRequest"
      responses:
        "200":
          description: Оптимальні або евристичні варіанти розкладу сформовано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleOptimizationResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /bookings:
    post:
      tags:
        - Bookings
      summary: Створення тимчасового холду багатофазного бронювання (HOLD)
      description: >-
        Атомарно фіксує темпоральні інтервали tstzrange у PostgreSQL із перевіркою
        інваріанта EXCLUDE USING gist та встановлює TTL 10 хвилин (SRS-FUN-DB-01..02).
      operationId: createBookingHold
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Унікальний UUID ключ ідепотентності запиту клієнта
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Тимчасовий холд бронювання успішно зафіксовано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ScheduleConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /bookings/{booking_id}/confirm:
    patch:
      tags:
        - Bookings
      summary: Підтвердження тимчасового холду бронювання (HOLD -> CONFIRMED)
      description: >-
        Переводить бронювання у підтверджений статус із перевіркою версії
        оптимістичного блокування та публікацією події в Transactional Outbox.
      operationId: confirmBookingHold
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmBookingRequest"
      responses:
        "200":
          description: Бронювання підтверджено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ScheduleConflictError"

  /schedules/stream:
    get:
      tags:
        - Realtime Streaming
      summary: Реактивний потік мутацій розкладу (Server-Sent Events)
      description: >-
        Встановлює однонапрямне HTTP EventStream з'єднання для миттєвої синхронізації
        диспетчерської матриці з Redis Pub/Sub (SRS-FUN-STREAM-02).
      operationId: streamScheduleUpdates
      parameters:
        - name: target_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Потік подій мутації розкладу (W3C SSE)
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: SCHEDULE_MUTATED\ndata: {\"booking_id\":\"...\",\"status\":\"CONFIRMED\"}\n\n"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Підписаний токен доступу JWT RS256 (TTL 15 хв), виданий Identity Provider

  schemas:
    ScheduleOptimizationRequest:
      type: object
      required:
        - service_id
        - target_date
      properties:
        service_id:
          type: string
          format: uuid
        target_date:
          type: string
          format: date
        preferred_start_time:
          type: string
          format: date-time
          nullable: true
        preferred_master_id:
          type: string
          format: uuid
          nullable: true
        max_candidates:
          type: integer
          minimum: 1
          maximum: 10
          default: 3

    PhaseSlotDTO:
      type: object
      required:
        - stage_id
        - stage_type
        - start_time
        - end_time
      properties:
        stage_id:
          type: string
          format: uuid
        stage_type:
          type: string
          enum:
            - ACTIVE
            - PASSIVE_WAIT
        master_id:
          type: string
          format: uuid
          nullable: true
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time

    ScheduleCandidateDTO:
      type: object
      required:
        - candidate_id
        - total_duration_minutes
        - master_rotations_count
        - phases
      properties:
        candidate_id:
          type: string
          format: uuid
        total_duration_minutes:
          type: integer
          minimum: 1
        master_rotations_count:
          type: integer
          minimum: 0
        phases:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PhaseSlotDTO"

    ScheduleOptimizationResponse:
      type: object
      required:
        - solver_mode
        - execution_time_ms
        - candidates
      properties:
        solver_mode:
          type: string
          enum:
            - CP_SAT_OPTIMAL
            - CP_SAT_FEASIBLE
            - BASELINE_HEURISTIC_FALLBACK
        execution_time_ms:
          type: number
          format: float
          minimum: 0
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleCandidateDTO"

    CreateBookingRequest:
      type: object
      required:
        - client_id
        - service_id
        - phases
      properties:
        client_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        phases:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PhaseSlotDTO"

    ConfirmBookingRequest:
      type: object
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: Версія агрегату для оптимістичного блокування

    BookingResponse:
      type: object
      required:
        - id
        - status
        - total_price
        - version
        - phases
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - HOLD
            - CONFIRMED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
        total_price:
          type: string
          pattern: '^\d+\.\d{2}$'
          example: "1450.00"
        hold_expires_at:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
        phases:
          type: array
          items:
            $ref: "#/components/schemas/PhaseSlotDTO"

    ProblemDetails:
      type: object
      description: Стандартизований формат помилок RFC 9457
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: "https://api.scheduling-core.internal/errors/schedule-conflict"
        title:
          type: string
          example: "Temporal Interval Exclusion Violation"
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: "Обраний часовий діапазон перетинається з активним бронюванням майстра (SQLSTATE 23P01)."
        trace_id:
          type: string
          format: uuid

  responses:
    UnauthorizedError:
      description: Помилка автентифікації (відсутній або невалідний JWT RS256)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ForbiddenError:
      description: Недостатньо прав доступу для ролі RBAC
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ScheduleConflictError:
      description: Конфлікт темпоральних інтервалів (GiST) або версії оптимістичного блокування
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationError:
      description: Помилка валідації вхідних даних (Pydantic v2) або виявлено цикл у DAG
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RateLimitError:
      description: Перевищено ліміт запитів на шлюзі (Token Bucket Rate Limiter)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
